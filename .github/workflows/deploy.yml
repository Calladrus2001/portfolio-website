name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  terraform:
    name: Terraform Apply Infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-south-1' }}

      - name: Terraform Init
        working-directory: ./src/infra
        run: terraform init

      - name: Terraform Format Check
        working-directory: ./src/infra
        run: terraform fmt -check

      - name: Terraform Plan
        working-directory: ./src/infra
        run: terraform plan -no-color
        env:
          TF_VAR_aws_region: ${{ secrets.AWS_REGION || 'ap-south-1' }}
          TF_VAR_vercel_api_token: ${{ secrets.VERCEL_API_TOKEN }}
          TF_VAR_vercel_project_id: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Terraform Apply
        working-directory: ./src/infra
        run: terraform apply -auto-approve -no-color
        env:
          TF_VAR_aws_region: ${{ secrets.AWS_REGION || 'ap-south-1' }}
          TF_VAR_vercel_api_token: ${{ secrets.VERCEL_API_TOKEN }}
          TF_VAR_vercel_project_id: ${{ secrets.VERCEL_PROJECT_ID }}
