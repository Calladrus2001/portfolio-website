name: Upload Resume to AWS S3

on:
  workflow_dispatch:
    inputs:
      file_path:
        description: "Path to resume file in repository (default: cv/Vishesh_Resume.docx)"
        required: false
        default: "cv/Vishesh_Resume.docx"

jobs:
  upload-resume:
    name: Upload Resume Word Document to S3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload Resume (.docx) to S3
        run: |
          if [ ! -f "${{ github.event.inputs.file_path }}" ]; then
            echo "Error: File '${{ github.event.inputs.file_path }}' not found!"
            exit 1
          fi
          aws s3 cp "${{ github.event.inputs.file_path }}" "s3://vishesh-general-purpose/cv/Vishesh_Resume.docx" \
            --content-type "application/vnd.openxmlformats-officedocument.wordprocessingml.document" \
            --cache-control "max-age=3600"
          echo "Successfully uploaded ${{ github.event.inputs.file_path }} to s3://vishesh-general-purpose/cv/Vishesh_Resume.docx"
